<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent World</title>
<link rel="stylesheet" href="/world.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="mark">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="12" cy="12" r="3.1" fill="currentColor"/>
      <path d="M12 3v3.2M12 17.8V21M3 12h3.2M17.8 12H21" stroke="currentColor" stroke-width="1.1"/>
    </svg>
    <span class="wordmark">AGENT&nbsp;WORLD</span>
    <span class="ver">v0.1</span>
  </div>
  <div class="worldmeta" id="worldmeta"></div>
  <div class="pulse" id="pulse"><i></i><span>reading live state</span></div>
</header>

<section class="away" id="away"></section>

<main class="stage">
  <div class="canvas" id="canvas">
    <svg class="wires" id="wires" aria-hidden="true"></svg>

    <div class="tier tier-owner">
      <div class="node owner" id="node-owner" data-kind="owner">
        <div class="glyph"><span>◆</span></div>
        <div class="nlabel">OWNER</div>
        <div class="nsub">control plane</div>
      </div>
    </div>

    <div class="tier tier-coord" id="tier-coord"></div>

    <div class="divisions" id="divisions"></div>
  </div>

  <aside class="rail">
    <div class="railhead">
      <h2>ACTIVITY</h2>
      <span class="hint" id="activityhint"></span>
    </div>
    <ol class="stream" id="stream"></ol>
  </aside>
</main>

<section class="lower">
  <div class="panel">
    <h2>PROJECTS</h2>
    <div id="projects" class="projects"></div>
  </div>
  <div class="panel">
    <h2>TASKS</h2>
    <div id="tasks" class="tasks"></div>
  </div>
</section>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawerhead">
    <div>
      <div class="dtitle" id="dtitle">—</div>
      <div class="dsub" id="dsub"></div>
    </div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <div class="drawerbody" id="dbody"></div>
</div>
<div class="scrim" id="scrim"></div>

<footer class="foot">
  <span id="foottext">every value on this screen is read from the world database — nothing here is generated for display</span>
</footer>

<script src="/world.js"></script>
</body>
</html>
